<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>三眼AI 注文アシスト (6-3-1分割)</title><style>  :root {    --bg-color: #121826;    --panel-bg: #1f2937;    --input-bg: #374151;    --text-main: #f3f4f6;    --text-muted: #9ca3af;    --accent-green: #10b981;    --accent-blue: #3b82f6;    --accent-red: #ef4444;    --accent-purple: #6366f1;    --border-color: #4b5563;  }  body {    background-color: var(--bg-color);    color: var(--text-main);    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;    margin: 0;    padding: 16px;    -webkit-font-smoothing: antialiased;    transition: border-top 0.3s;    border-top: 5px solid var(--accent-green);  }  .container {    max-width: 500px;    margin: 0 auto;  }  .header-container {    display: flex;    justify-content: space-between;    align-items: center;    margin-bottom: 20px;  }  h1 {    font-size: 1.2rem;    margin: 0;  }  .btn-clear {    background: none;    border: none;    color: var(--accent-blue);    font-size: 0.95rem;    font-weight: bold;    cursor: pointer;    padding: 8px;  }  .btn-clear:active { opacity: 0.7; }  .section-title {    font-size: 0.85rem;    color: var(--text-muted);    margin-bottom: 8px;    font-weight: bold;  }  .panel {    background-color: var(--panel-bg);    border-radius: 12px;    padding: 16px;    margin-bottom: 24px;    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);  }  .broker-select {    display: flex;    gap: 15px;    margin-bottom: 5px;  }  .broker-select label {    display: flex;    align-items: center;    gap: 5px;    font-size: 0.9rem;    cursor: pointer;  }  textarea {    width: 100%;    background-color: var(--input-bg);    color: var(--text-main);    border: 1px solid var(--border-color);    border-radius: 8px;    padding: 12px;    font-size: 0.9rem;    box-sizing: border-box;    min-height: 100px;    margin-bottom: 12px;    resize: vertical;  }  .btn-extract {    width: 100%;    background-color: var(--accent-purple);    color: white;    border: none;    padding: 14px;    border-radius: 8px;    font-size: 1rem;    font-weight: bold;    cursor: pointer;  }  .btn-extract:active { opacity: 0.8; }  .input-group { margin-bottom: 12px; }  .input-group label {    display: block;    font-size: 0.8rem;    color: var(--text-muted);    margin-bottom: 4px;  }  .input-group input {    width: 100%;    background-color: var(--input-bg);    color: var(--text-main);    border: 1px solid var(--border-color);    border-radius: 8px;    padding: 12px;    font-size: 1.2rem;    font-weight: bold;    box-sizing: border-box;  }  .input-group input.green-text { color: var(--accent-green); }  .input-group input.blue-text { color: var(--accent-blue); }  .input-group input.red-text { color: var(--accent-red); }  .output-row {    display: flex;    justify-content: space-between;    align-items: center;    background-color: var(--input-bg);    border-radius: 8px;    padding: 10px 12px;    margin-bottom: 12px;  }  .output-info {    display: flex;    flex-direction: column;  }  .output-label {    font-size: 0.75rem;    color: var(--text-muted);    margin-bottom: 2px;  }  .output-value {    font-size: 1.3rem;    font-weight: bold;  }  .val-green { color: var(--accent-green); }  .val-blue { color: var(--accent-blue); }  .val-red { color: var(--accent-red); }  .btn-copy {    padding: 10px 16px;    border-radius: 6px;    border: none;    color: white;    font-weight: bold;    cursor: pointer;    font-size: 0.95rem;    min-width: 90px;  }  .btn-copy.green { background-color: var(--accent-green); }  .btn-copy.blue { background-color: var(--accent-blue); }  .btn-copy.red { background-color: var(--accent-red); }  .btn-copy:active { opacity: 0.8; }  </style></head><body>
<div class="container">  <div class="header-container">    <h1 id="appTitle">注文アシスト (GMO)</h1>    <button class="btn-clear" onclick="clearData()">🗑️ クリア</button>  </div>

  <div class="section-title">利用する証券会社を選択</div>
  <div class="panel">
    <div class="broker-select">
      <label><input type="radio" name="broker" value="gmo" checked onchange="changeBroker()"> GMO</label>
      <label><input type="radio" name="broker" value="dukas" onchange="changeBroker()"> デューカスコピー</label>
    </div>
  </div>

  <div class="section-title">1. 通知テキストを貼り付け</div>
  <div class="panel">    <textarea id="notifyText" placeholder="ここに三眼AIの通知をペーストしてください。"></textarea>    <button class="btn-extract" onclick="extractData()">数値を自動入力する</button>  </div>


  <div class="section-title">3. 発注用データ (6割・3割・1割 分割)</div>    
  <div class="panel">    <div class="section-title" style="color: #fff; font-size: 1rem; margin-bottom: 12px;">1回目 OCO注文 (6割)</div>        <div class="output-row">      <div class="output-info">        <span class="output-label">ロット数 (6割)</span>        <span class="output-value val-green" id="outLot1">--</span>      </div>      <button class="btn-copy green" onclick="copyVal('outLot1', this)">📋 コピー</button>    </div>    <div class="output-row">      <div class="output-info">        <span class="output-label">指値 (利確1)</span>        <span class="output-value val-blue" id="outTp1">--</span>      </div>      <button class="btn-copy blue" onclick="copyVal('outTp1', this)">📋 コピー</button>    </div>    <div class="output-row">      <div class="output-info">        <span class="output-label">逆指値 (損切)</span>        <span class="output-value val-red" id="outSl1">--</span>      </div>      <button class="btn-copy red" onclick="copyVal('outSl1', this)">📋 コピー</button>    </div>  </div>

  <div class="panel">    <div class="section-title" style="color: #fff; font-size: 1rem; margin-bottom: 12px;">2回目 OCO注文 (3割)</div>        <div class="output-row">      <div class="output-info">        <span class="output-label">ロット数 (3割)</span>        <span class="output-value val-green" id="outLot2">--</span>      </div>      <button class="btn-copy green" onclick="copyVal('outLot2', this)">📋 コピー</button>    </div>    <div class="output-row">      <div class="output-info">        <span class="output-label">指値 (利確2)</span>        <span class="output-value val-blue" id="outTp2">--</span>      </div>      <button class="btn-copy blue" onclick="copyVal('outTp2', this)">📋 コピー</button>    </div>    <div class="output-row">      <div class="output-info">        <span class="output-label">逆指値 (損切)</span>        <span class="output-value val-red" id="outSl2">--</span>      </div>      <button class="btn-copy red" onclick="copyVal('outSl2', this)">📋 コピー</button>    </div>  </div>

  <div class="panel">    <div class="section-title" style="color: #fff; font-size: 1rem; margin-bottom: 12px;">3回目 OCO注文 (残り1割)</div>        <div class="output-row">      <div class="output-info">        <span class="output-label">ロット数 (1割)</span>        <span class="output-value val-green" id="outLot3">--</span>      </div>      <button class="btn-copy green" onclick="copyVal('outLot3', this)">📋 コピー</button>    </div>    <div class="output-row">      <div class="output-info">        <span class="output-label">指値 (利確3)</span>        <span class="output-value val-blue" id="outTp3">--</span>      </div>      <button class="btn-copy blue" onclick="copyVal('outTp3', this)">📋 コピー</button>    </div>    <div class="output-row">      <div class="output-info">        <span class="output-label">逆指値 (損切)</span>        <span class="output-value val-red" id="outSl3">--</span>      </div>      <button class="btn-copy red" onclick="copyVal('outSl3', this)">📋 コピー</button>    </div>  </div></div>

<script>
  window.onload = function() {
    const savedBroker = localStorage.getItem('savedBroker');
    if (savedBroker) {
      document.querySelector(`input[name="broker"][value="${savedBroker}"]`).checked = true;
    }
    changeBroker(); 
    
    const savedLot = localStorage.getItem('savedTotalLot');
    if (savedLot) {
      document.getElementById('totalLot').value = savedLot;
    }
    calculate();
  }

  function changeBroker() {
    const broker = document.querySelector('input[name="broker"]:checked').value;
    const label = document.getElementById('lotLabel');
    const title = document.getElementById('appTitle');
    
    if (broker === 'gmo') {
      label.innerHTML = '入力単位：<b style="color: var(--accent-green);">万通貨</b> （例: 6.3）';
      title.innerText = '注文アシスト (GMO)';
      document.body.style.borderTop = '5px solid var(--accent-green)';
    } else {
      label.innerHTML = '入力単位：<b style="color: var(--accent-red);">ロット</b> （例: 0.63）';
      title.innerText = '注文アシスト (デューカス)';
      document.body.style.borderTop = '5px solid var(--accent-red)';
    }
    
    const prevBroker = localStorage.getItem('savedBroker');
    if (prevBroker && prevBroker !== broker) {
       document.getElementById('totalLot').value = '';
    }
    localStorage.setItem('savedBroker', broker);
    calculate();
  }

  function clearData() {
    document.getElementById('notifyText').value = '';
    document.getElementById('entryRate').value = '';
    document.getElementById('tp1').value = '';
    document.getElementById('tp2').value = '';
    document.getElementById('tp3').value = '';
    document.getElementById('sl').value = '';
    document.getElementById('outLot1').innerText = '--';
    document.getElementById('outTp1').innerText = '--';
    document.getElementById('outSl1').innerText = '--';
    document.getElementById('outLot2').innerText = '--';
    document.getElementById('outTp2').innerText = '--';
    document.getElementById('outSl2').innerText = '--';
    document.getElementById('outLot3').innerText = '--';
    document.getElementById('outTp3').innerText = '--';
    document.getElementById('outSl3').innerText = '--';
  }

  function extractData() {
    const text = document.getElementById('notifyText').value;
    const entryMatch = text.match(/@\s*([\d.]+)/);
    const tp1Match = text.match(/利確目標[１1][:：]\s*([\d.]+)/);
    const tp2Match = text.match(/利確目標[２2][:：]\s*([\d.]+)/);
    const tp3Match = text.match(/利確目標[３3][:：]\s*([\d.]+)/);
    const slMatch = text.match(/損切り[\s ]*[:：]\s*([\d.]+)/);
    let extracted = false;
    if (entryMatch) { document.getElementById('entryRate').value = entryMatch[1]; extracted = true; }
    if (tp1Match) { document.getElementById('tp1').value = tp1Match[1]; extracted = true; }
    if (tp2Match) { document.getElementById('tp2').value = tp2Match[1]; extracted = true; }
    if (tp3Match) { document.getElementById('tp3').value = tp3Match[1]; extracted = true; }
    if (slMatch) { document.getElementById('sl').value = slMatch[1]; extracted = true; }
    if (extracted) {
      calculate();
      const btn = document.querySelector('.btn-extract');
      btn.innerText = "✔ 抽出・計算完了！";
      btn.style.backgroundColor = "#10b981";
      setTimeout(() => {
        btn.innerText = "数値を自動入力する";
        btn.style.backgroundColor = "#6366f1";
      }, 2000);
    } else {
      alert("数値を抽出できませんでした。テキストの形式を確認してください。");
    }
  }

  function calculate() {
    const broker = document.querySelector('input[name="broker"]:checked').value;
    const totalLot = parseFloat(document.getElementById('totalLot').value) || 0;
    const tp1 = document.getElementById('tp1').value;
    const tp2 = document.getElementById('tp2').value;
    const tp3 = document.getElementById('tp3').value;
    const sl = document.getElementById('sl').value;

    localStorage.setItem('savedTotalLot', document.getElementById('totalLot').value);


    document.getElementById('outLot1').innerText = (totalLot > 0 && tp1) ? lot1 : '--';
    document.getElementById('outTp1').innerText = tp1 || '--';
    document.getElementById('outSl1').innerText = sl || '--';
    
    document.getElementById('outLot2').innerText = (totalLot > 0 && tp2) ? lot2 : '--';
    document.getElementById('outTp2').innerText = tp2 || '--';
    document.getElementById('outSl2').innerText = sl || '--';
    
    document.getElementById('outLot3').innerText = (totalLot > 0 && tp3) ? lot3 : '--';
    document.getElementById('outTp3').innerText = tp3 || '--';
    document.getElementById('outSl3').innerText = sl || '--';
  }

  function copyVal(elementId, btnElement) {
    const val = document.getElementById(elementId).innerText;
    if (val === '--' || !val) return;
    navigator.clipboard.writeText(val).then(() => {
      const originalText = btnElement.innerText;
      btnElement.innerText = "✔ コピー済";
      setTimeout(() => { btnElement.innerText = originalText; }, 1500);
    }).catch(err => {
      alert('コピーに失敗しました。');
    });
  }
</script></body></html>
